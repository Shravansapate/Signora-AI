[project]
name = "video-to-glb"
version = "0.1.0"
description = "Milestone-based Indian Sign Language video to animated GLB converter."
requires-python = ">=3.11"
dependencies = [
    "mediapipe==0.10.35",
    "numpy==2.2.6",
    "opencv-contrib-python==4.11.0.86",
    "PyYAML==6.0.2",
    "cryptography==50.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
