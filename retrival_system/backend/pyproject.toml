[project]
name = "signora-backend"
version = "0.1.0"
description = "Signora ISL retrieval backend and asset validation"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.116,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0.43,<2.1",
    "uvicorn>=0.35,<1",
    "websockets>=15,<17",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.2,<2"]
retrieval = ["onnxruntime>=1.23,<2", "tokenizers>=0.22,<1", "huggingface-hub>=0.34,<2", "numpy>=2,<3"]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=9.0.3,<10",
    "ruff>=0.12,<1",
]

[project.scripts]
signora-inventory = "app.assets.inventory:main"
signora-worker = "app.worker:main"
signora-asr-download = "app.asr_model:main"
signora-encoder-download = "app.retrieval.encoder_model:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
